<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMI to GCal</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">
          <img src="icons/icon-48.png?v=2" alt="" />
        </div>
        <div>
          <h1>TMI to GCal</h1>
          <p>腾讯会议邀请导入 Google 日历</p>
        </div>
      </header>

      <section class="input-section" aria-labelledby="invitation-heading">
        <div class="section-heading">
          <label id="invitation-heading" for="invitationText">邀请文本</label>
          <button class="text-button" id="parseButton" type="button">重新解析</button>
        </div>
        <button class="secondary-button" id="readClipboardButton" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M9 5a3 3 0 0 1 6 0M9 5h6v3H9V5Z" />
            <path d="M15 6h2a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2" />
          </svg>
          从剪贴板读取
        </button>
        <textarea
          id="invitationText"
          rows="5"
          spellcheck="false"
          placeholder="在这里粘贴腾讯会议的“完整邀请”或“复制邀请”文本"
        ></textarea>
        <div class="status" id="parseStatus" role="status" aria-live="polite" data-tone="neutral">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v5M12 8h.01" />
          </svg>
          <span>粘贴邀请后将自动解析</span>
        </div>
      </section>

      <section class="preview-section" aria-labelledby="preview-heading">
        <div class="section-heading">
          <h2 id="preview-heading">日程预览</h2>
          <span class="editable-note">可编辑</span>
        </div>

        <label class="field field-wide">
          <span>标题</span>
          <input id="eventTitle" type="text" autocomplete="off" placeholder="会议主题" />
        </label>

        <div class="date-grid">
          <label class="field">
            <span>开始时间</span>
            <input id="startTime" type="datetime-local" />
          </label>
          <label class="field">
            <span>结束时间</span>
            <input id="endTime" type="datetime-local" />
          </label>
        </div>

        <label class="field field-wide">
          <span>时区</span>
          <select id="timezone"></select>
        </label>

        <div class="field field-wide account-field">
          <div class="field-label-row">
            <span>Google 账号</span>
            <button class="text-button" id="editAccountLabelsButton" type="button">编辑名称</button>
          </div>
          <select id="googleAccount" aria-label="Google 账号">
            <option value="0">账号 1</option>
            <option value="1">账号 2</option>
            <option value="2">账号 3</option>
            <option value="3">账号 4</option>
          </select>
        </div>

        <label class="field field-wide">
          <span>会议链接</span>
          <input id="meetingUrl" type="url" autocomplete="off" placeholder="https://meeting.tencent.com/..." />
        </label>

        <label class="field field-wide">
          <span>会议号</span>
          <input id="meetingId" type="text" inputmode="numeric" autocomplete="off" placeholder="123-456-789" />
        </label>

        <label class="field field-wide">
          <span>说明</span>
          <textarea id="eventDescription" rows="4" placeholder="日程说明"></textarea>
        </label>
      </section>

      <footer class="action-footer">
        <button class="primary-button" id="createEventButton" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M7 2v3M17 2v3M3.5 9h17M5.5 4h13a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
            <path d="M12 12v6M9 15h6" />
          </svg>
          创建 Google Calendar 日程
        </button>

        <p class="privacy-note">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
          </svg>
          内容仅在本机解析，不会上传或存储
        </p>
      </footer>
    </main>

    <dialog class="account-dialog" id="accountLabelsDialog" aria-labelledby="account-dialog-title">
      <form method="dialog">
        <header class="dialog-header">
          <div>
            <h2 id="account-dialog-title">命名 Google 账号</h2>
            <p>点击查看确认账号，再填入容易辨认的名称。</p>
          </div>
          <button class="icon-button" id="closeAccountLabelsButton" type="button" aria-label="关闭">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </header>

        <div class="account-label-list">
          <label class="account-label-row">
            <span>账号 1</span>
            <input data-account-label="0" type="text" maxlength="60" autocomplete="off" placeholder="例如：私人 Gmail" />
            <button class="compact-button" data-open-account="0" type="button" title="打开此账号的 Google Calendar">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M14 5h5v5M19 5l-8 8" />
                <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
              </svg>
              查看
            </button>
          </label>
          <label class="account-label-row">
            <span>账号 2</span>
            <input data-account-label="1" type="text" maxlength="60" autocomplete="off" placeholder="例如：工作账号" />
            <button class="compact-button" data-open-account="1" type="button" title="打开此账号的 Google Calendar">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M14 5h5v5M19 5l-8 8" />
                <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
              </svg>
              查看
            </button>
          </label>
          <label class="account-label-row">
            <span>账号 3</span>
            <input data-account-label="2" type="text" maxlength="60" autocomplete="off" placeholder="账号 3 名称（可选）" />
            <button class="compact-button" data-open-account="2" type="button" title="打开此账号的 Google Calendar">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M14 5h5v5M19 5l-8 8" />
                <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
              </svg>
              查看
            </button>
          </label>
          <label class="account-label-row">
            <span>账号 4</span>
            <input data-account-label="3" type="text" maxlength="60" autocomplete="off" placeholder="账号 4 名称（可选）" />
            <button class="compact-button" data-open-account="3" type="button" title="打开此账号的 Google Calendar">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M14 5h5v5M19 5l-8 8" />
                <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
              </svg>
              查看
            </button>
          </label>
        </div>

        <p class="dialog-note">名称仅保存在本机。扩展不会读取你的 Google 邮箱或个人资料。</p>
        <div class="dialog-actions">
          <button class="dialog-cancel-button" id="cancelAccountLabelsButton" type="button">取消</button>
          <button class="dialog-save-button" id="saveAccountLabelsButton" type="submit">保存名称</button>
        </div>
      </form>
    </dialog>

    <script src="parser.js?v=2"></script>
    <script src="popup.js?v=2"></script>
  </body>
</html>
